<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard | Nooraya Quran Academy</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#0B3D2E', dark: '#062A20', light: '#155E48' },
                        gold: { DEFAULT: '#C9A45C', light: '#E5D5A3' },
                        ivory: '#FAF8F1',
                        text: '#17211D',
                        muted: '#6B746E',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arabic: ['Amiri', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FAF8F1; color: #17211D; font-family: 'Inter', sans-serif; }
        .nav-link { display: flex; align-items: center; padding: 12px 16px; border-radius: 12px; color: #FAF8F1; font-weight: 500; transition: all 0.3s; text-decoration: none; }
        .nav-link:hover { background-color: rgba(201, 164, 92, 0.1); color: #C9A45C; }
        .nav-link.active { background-color: #C9A45C; color: #062A20; }
        .card { background-color: #FFFFFF; border-radius: 20px; border: 1px solid rgba(107, 116, 110, 0.05); box-shadow: 0 10px 30px -15px rgba(11, 61, 46, 0.1); }
        .progress-bar { height: 8px; background-color: rgba(11, 61, 46, 0.1); border-radius: 9999px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 9999px; background-color: #C9A45C; }
        .btn-gold { background-color: #C9A45C; color: #0B3D2E; padding: 10px 24px; border-radius: 9999px; font-weight: 600; transition: all 0.3s; box-shadow: 0 0 15px rgba(201, 164, 92, 0.3); display: inline-block; border: none; cursor: pointer; }
        .btn-gold:hover { background-color: #E5D5A3; transform: translateY(-2px); }
        .form-input { transition: all 0.3s; border: 1px solid rgba(107, 116, 110, 0.2); background-color: #fff; width: 100%; padding: 12px 16px; border-radius: 12px; font-size: 14px; color: #17211D; }
        .form-input:focus { outline: none; border-color: #C9A45C; box-shadow: 0 0 0 3px rgba(201, 164, 92, 0.2); }
        label { display: block; font-size: 14px; font-weight: 500; color: #17211D; margin-bottom: 8px; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- ==================== SIDEBAR ==================== -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-64 bg-primary-dark text-white flex flex-col p-4 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="flex items-center justify-between mb-8 px-2">
            <a href="index.html" class="text-2xl font-bold">Parent Panel</a>
            <button id="close-sidebar" class="lg:hidden text-ivory/60 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <nav class="flex-grow space-y-2">
            <a href="parent-dashboard.html" class="nav-link active">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                My Children
            </a>
        </nav>

        <a href="#" id="logout-btn" class="nav-link mt-auto bg-white/5 hover:bg-red-500/20 hover:text-red-400 text-ivory/80">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Logout
        </a>
    </aside>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="flex-1 lg:ml-0 min-h-screen flex flex-col">
        
        <!-- Top Bar (Mobile Menu) -->
        <header class="lg:hidden sticky top-0 z-40 bg-primary-dark text-white p-4 flex items-center justify-between">
            <span class="text-xl font-bold">Parent Panel</span>
            <button id="open-sidebar" class="p-2 text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <!-- Dashboard Content -->
        <main class="flex-grow p-6 md:p-10">
            
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-primary-dark">Parent Dashboard</h1>
                <p class="text-muted mt-1">Monitor your children's progress, attendance, and homework.</p>
            </div>

            <!-- Add Child Form -->
            <div class="card p-6 md:p-8 mb-8">
                <h3 class="text-xl font-bold text-primary-dark mb-6">Add Child</h3>
                <p class="text-muted text-sm mb-4">Enter your child's registered email to link them to your account.</p>
                
                <form id="add-child-form" class="flex flex-col md:flex-row gap-4">
                    <input type="email" id="child-email" required class="form-input flex-grow" placeholder="child@example.com">
                    <button type="submit" id="add-child-btn" class="btn-gold text-sm whitespace-nowrap">Link Child</button>
                </form>
                <div id="child-message" class="mt-4 text-sm"></div>
            </div>

            <!-- Children Progress Container -->
            <div id="children-container" class="space-y-8">
                <div class="text-center text-muted py-10">Loading your children data...</div>
            </div>

        </main>
    </div>

    <!-- Mobile Sidebar Toggle Script -->
    <script>
        const sidebar = document.getElementById('sidebar');
        document.getElementById('open-sidebar').addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); });
        document.getElementById('close-sidebar').addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); });
    </script>
    
    <!-- Parent Panel Logic Script -->
    <script type="module" src="parent.js"></script>

</body>
</html>
